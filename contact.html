<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Srushti Patil — Financial Engineering</title>
  <meta name="description" content="Get in touch.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact.html">
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main" class="wrap">
    <div class="page-title">
      <h1>Contact</h1>
      <p>Collaborations, questions, feedback on a model — send a note.</p>
    </div>

    <form class="form" id="contact-form" method="post">
      <label>Name <input name="name" required autocomplete="name"></label>
      <label>Email <input name="email" type="email" required autocomplete="email"></label>
      <label>Message <textarea name="message" required></textarea></label>
      <input class="hp" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div><button class="btn" type="submit">SEND MESSAGE</button></div>
      <p id="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
  <script>
    (function () {
      var S = window.SITE || {};
      var form = document.getElementById("contact-form");
      var status = document.getElementById("form-status");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var data = new FormData(form);
        if (data.get("_gotcha")) return;           // bot trap

        if (S.formEndpoint) {                       // Formspree / similar
          status.textContent = "Sending…";
          fetch(S.formEndpoint, { method: "POST", body: data, headers: { Accept: "application/json" } })
            .then(function (r) {
              if (!r.ok) throw new Error(r.status);
              form.reset(); status.textContent = "Thanks — message sent.";
            })
            .catch(function () { status.textContent = "Could not send. Please try again or email directly."; });
        } else if (S.email) {                       // fallback: open mail app
          var subject = encodeURIComponent("Message from " + data.get("name"));
          var body = encodeURIComponent(data.get("message") + "\n\n— " + data.get("name") + " (" + data.get("email") + ")");
          window.location.href = "mailto:" + S.email + "?subject=" + subject + "&body=" + body;
        } else {
          status.textContent = "Contact form is not connected yet (set formEndpoint or email in js/config.js).";
        }
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Srushti Patil — Financial Engineering</title>
  <meta name="description" content="Get in touch for quantitative finance research, collaboration, or general inquiries.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact.html">
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main" class="wrap">
    <div class="page-title">
      <h1>Contact</h1>
      <p>Have a question, feedback on macro analysis, or interested in collaborating on quantitative finance research? Send a message below.</p>
    </div>

    <section class="section">
      <!-- Replace YOUR_FORMSPREE_ID with your form ID from formspree.io -->
      <form class="form" action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
        
        <label for="full-name">
          Full Name
          <input type="text" id="full-name" name="name" required placeholder="Jane Doe" autocomplete="name">
        </label>

        <label for="email-address">
          Email Address
          <input type="email" id="email-address" name="_replyto" required placeholder="jane@example.com" autocomplete="email">
        </label>

        <label for="subject">
          Subject
          <input type="text" id="subject" name="_subject" required placeholder="Quantitative Research / Collaboration">
        </label>

        <label for="message">
          Message
          <textarea id="message" name="message" required placeholder="Hi Srushti, I looked at your macro dashboard..." rows="6"></textarea>
        </label>

        <!-- Hidden honeypot input to trap automated spam bots -->
        <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div>
          <button type="submit" class="btn">SEND MESSAGE</button>
        </div>
      </form>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
